<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP2 - Menú de Meriendas</title>
    <link rel="stylesheet" href="estilos.css" />
</head>
<body>
    <main>
        <header>
            <h1>Ejercicio 1: Menú de meriendas</h1>
            <p>Mostrar una lista desde un arreglo y contar sus elementos con un botón</p>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="destacados.html">Destacados</a>
                <a href="listado.html">Listado</a>
            </nav>
        </header>
        
        <section class="caja">
        <h2>Meriendas disponibles</h2>
        <ul id="listaMeriendas"></ul>
        <button id="mostrarCantidad">Mostrar cantidad</button>
        <p id="cantidad">Cantidad: pendiente.</p>
        </section>
    </main>

    <script>
        const meriendas = ["Café con leche", "Yogurt con granola", "Tostadas", "Medialunas", "Licuado"];
        const listaMeriendas = document.getElementById("listaMeriendas");
        const mostrarCantidad = document.getElementById("mostrarCantidad");
        const cantidad = document.getElementById("cantidad");

        listaMeriendas.innerHTML = meriendas.map((merienda) => `<li>${merienda}</li>`).join("");

        mostrarCantidad.addEventListener("click", () => {
        cantidad.textContent = `Cantidad: ${meriendas.length} meriendas.`;
        });
    </script>
</body>
</html>
